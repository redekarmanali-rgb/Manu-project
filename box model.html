<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0;
            font-family: 'Arial';
            border-radius:5px;
             

        }
        .box1{
            width:300px;
            height:150px;
            background-color: antiquewhite;
             margin-top:15px;

        }
        .box2{
            width:250px;
            padding:20px;
            background-color: aqua;
            margin-top:15px;


        }
        .box4{
            width:250px;
            margin:20px;
            background-color: lightcyan;

        }
        .box6{
            width:250px;
            padding:20px;
            border:2px solid black;
             margin-top: 4px;

        }
        .box9{
            width:200px;
            height:100px;
            border:2px solid green;
            border-radius:15px ;
             margin-top: 4px;
             padding:8px;
        }
        .box10{
            width:250px;
            height:80px;
            border:2px solid black;
            overflow:auto;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="box1">Width and Height Example</div>
    <div class="box2">Padding</div>
    <div class="box4">Margin</div>
    <div class="box6">Border</div>
    <div class="box9">border Radius</div>
    <div class="box10">This is a long content inside a Small box.
        overflow controls how the extra content is displayed
    </div>
</body>
</html>
