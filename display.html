<!DOCTYPE html>
<html>
<head>
 <title>CSS Flexbox</title>
 <style>
 .container {
 display: flex;
 flex-direction: row;
 flex-wrap: wrap;
 justify-content: space-between;
 gap: 20px;
 background-color: lightgray;
 padding: 20px;
 }
 .item1 { flex-grow: 1; padding: 30px; background-color: lightblue; }
 .item2 { flex-grow: 2; padding: 30px; background-color: lightgreen; }
 .item3 { flex-grow: 1; padding: 30px; background-color: lightyellow; }
 .item4 { flex-grow: 1; padding: 30px; background-color: lightpink; }
 </style>
</head>
<body>
    <h1>Flexbox Example</h1>
 <div class="container">
 <div class="item1">HTML</div>
 <div class="item2">CSS</div>
 <div class="item3">JavaScript</div>
 <div class="item4">Bootstrap</div>
 </div>
</body>
</html>
